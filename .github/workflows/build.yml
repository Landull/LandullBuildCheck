name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        shell: cmd
        run: echo.| build_windows.bat

      - name: Smoke test
        shell: pwsh
        run: |
          # a benchmark worker runs inside the packaged exe
          $p = Start-Process dist\LandullBuildCheck.exe -ArgumentList "--worker","cpu","1" -RedirectStandardOutput w.txt -NoNewWindow -Wait -PassThru
          Get-Content w.txt
          if (-not (Select-String -Path w.txt -Pattern "RESULT" -Quiet)) { exit 1 }
          # the sensor library loads and the inventory runs
          $p = Start-Process dist\LandullBuildCheck.exe -ArgumentList "--selftest","selftest.json" -RedirectStandardOutput s.txt -NoNewWindow -Wait -PassThru
          Get-Content s.txt
          $j = Get-Content selftest.json -Raw | ConvertFrom-Json
          "backend: $($j.sensor_backend)  cpu: $($j.inventory.cpu.name)  checks: $($j.checks.Count)"
          if ($j.sensor_backend -ne "LibreHardwareMonitor") { Write-Error "LibreHardwareMonitor did not load"; exit 1 }
          if (-not $j.inventory.cpu.name) { Write-Error "inventory is empty"; exit 1 }
          Compress-Archive -Path dist\LandullBuildCheck.exe, README.md -DestinationPath dist\LandullBuildCheck-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LandullBuildCheck-Windows
          path: |
            dist/LandullBuildCheck.exe
            selftest.json

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/LandullBuildCheck.exe
            dist/LandullBuildCheck-Windows.zip
          body: |
            Post-build health check for Windows PCs: specs, live sensors, stress test, benchmarks and a PDF report.

            **Download** `LandullBuildCheck.exe` and run it. It asks for administrator access so it can read the
            hardware sensors. It isn't code-signed, so SmartScreen will warn the first time: click **More info** > **Run anyway**.
